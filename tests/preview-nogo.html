<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>ShowReady pre-show report</title>
<style>
/* ---------- Colour tokens (light) ---------- */
:root{
  color-scheme: light dark;
  --bg:#eef0f3; --surface:#ffffff; --surface-2:#f6f7f9; --border:#d3d8df; --border-strong:#9aa3af;
  --text:#14181f; --muted:#454e5b; --faint:#5d6672; --accent:#0a58a8;
  --go:#14622b;   --go-bg:#e4f3e8;   --go-line:#2f9a4d;   --go-solid:#1d7a38;
  --warn:#7c4a00; --warn-bg:#fff1d2; --warn-line:#b36b00; --warn-solid:#a85f00;
  --fail:#a91d17; --fail-bg:#fde9e8; --fail-line:#d63a30; --fail-solid:#c0261d;
  --info:#1a5388; --info-bg:#e5eff8; --info-line:#4a86c3; --info-solid:#2f6fae;
  --skip:#505965; --skip-bg:#eceef1; --skip-line:#747d89; --skip-solid:#6b7480;
  --c1:#1f5fae; --c2:#b8520a; --c3:#0d7468; --c4:#7a4bb3; --c5:#6b7480;
  --bar:#6f87a3; --bar-soft:#c9d4e0; --band:rgba(80,110,150,.12);
  --sans: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", "Cascadia Code", Consolas, "Liberation Mono", Menlo, monospace;
}
@media screen and (prefers-color-scheme: dark){
  :root{
    --bg:#0e1115; --surface:#171b21; --surface-2:#1e232b; --border:#2d343e; --border-strong:#56606d;
    --text:#e9edf2; --muted:#b0b8c3; --faint:#96a0ad; --accent:#74b6f4;
    --go:#7bdc94;   --go-bg:#12261a;   --go-line:#3fae5e;   --go-solid:#2a9a4d;
    --warn:#f4bd55; --warn-bg:#2a2010; --warn-line:#d99a22; --warn-solid:#b8700a;
    --fail:#ff9088; --fail-bg:#2f1716; --fail-line:#e5534b; --fail-solid:#d6372d;
    --info:#86bdef; --info-bg:#122230; --info-line:#4b8fcf; --info-solid:#3a7bbd;
    --skip:#a2abb7; --skip-bg:#1d2127; --skip-line:#626c79; --skip-solid:#6c7683;
    --c1:#6aaaf0; --c2:#f0a050; --c3:#4fc9b7; --c4:#b99aee; --c5:#98a1ad;
    --bar:#7d9bbd; --bar-soft:#34414f; --band:rgba(120,160,210,.14);
  }
}

/* ---------- Base ---------- */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%; text-size-adjust:100%}
body{margin:0; background:var(--bg); color:var(--text); font:16px/1.5 var(--sans); -webkit-font-smoothing:antialiased}
.page{max-width:980px; margin:0 auto; padding:14px 16px 80px}
h1,h2,h3,h4,p{margin:0}
a{color:var(--accent)}
code,.mono{font-family:var(--mono); font-variant-numeric:tabular-nums}
.nm{color:var(--faint); font-style:italic; font-weight:400; font-family:var(--sans); font-size:.9em}
.sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px; border-radius:3px}

/* status variable sets */
.s-pass{--x:var(--go);   --xbg:var(--go-bg);   --xl:var(--go-line);   --xs:var(--go-solid)}
.s-warn{--x:var(--warn); --xbg:var(--warn-bg); --xl:var(--warn-line); --xs:var(--warn-solid)}
.s-fail{--x:var(--fail); --xbg:var(--fail-bg); --xl:var(--fail-line); --xs:var(--fail-solid)}
.s-info{--x:var(--info); --xbg:var(--info-bg); --xl:var(--info-line); --xs:var(--info-solid)}
.s-skip{--x:var(--skip); --xbg:var(--skip-bg); --xl:var(--skip-line); --xs:var(--skip-solid)}

.badge{display:inline-flex; align-items:center; gap:5px; padding:1px 9px 1px 6px; border-radius:5px; border:1.5px solid var(--xl);
  background:var(--xbg); color:var(--x); font:700 12px/1.7 var(--sans); letter-spacing:.06em; white-space:nowrap; -webkit-print-color-adjust:exact; print-color-adjust:exact}
.ico{width:16px; height:16px; flex:none}

/* ---------- Top bar ---------- */
.topbar{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; padding:6px 0 10px}
.brand{font:800 15px var(--sans); letter-spacing:.12em; text-transform:uppercase}
.brand span{font-weight:500; color:var(--muted); letter-spacing:.04em; text-transform:none; margin-left:8px}
.nav{display:flex; flex-wrap:wrap; gap:4px 6px; margin:0 0 14px; padding:0; list-style:none}
.nav a{display:inline-block; padding:5px 11px; border:1px solid var(--border); border-radius:999px; background:var(--surface); color:var(--text); text-decoration:none; font-size:13px; font-weight:600}
.nav a:hover{border-color:var(--border-strong)}
.nav b{color:var(--muted); margin-right:5px; font-weight:700}
.meta{display:flex; flex-wrap:wrap; gap:4px 18px; color:var(--muted); font-size:14px; margin:0 0 18px}
.meta span{min-width:0; overflow-wrap:anywhere}
.meta span b{color:var(--text); font-weight:600}
.plan{color:var(--muted); font-size:14px; margin:-8px 0 18px}

.btn{font:600 14px/1.2 var(--sans); min-height:40px; padding:9px 16px; border-radius:7px; border:1.5px solid var(--border-strong); background:var(--surface); color:var(--text); cursor:pointer}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--text); color:var(--bg); border-color:var(--text)}
.btn.primary:hover{opacity:.9}
.btn.small{min-height:32px; padding:5px 11px; font-size:13px}
.btn:focus-within{outline:3px solid var(--accent); outline-offset:2px}
.btn.done{border-color:var(--go-line); color:var(--go)}

/* ---------- Section frame ---------- */
.sec{margin-top:44px}
.sec > h2{display:flex; align-items:baseline; gap:12px; font-size:22px; line-height:1.25; font-weight:800; padding-bottom:10px; border-bottom:2px solid var(--text); margin-bottom:6px}
.sec > h2 .n{font:800 14px var(--mono); color:var(--bg); background:var(--text); border-radius:4px; padding:1px 8px; position:relative; top:-2px}
.sec .lede{color:var(--muted); margin:6px 0 18px; max-width:70ch}
.sub{margin-top:30px}
.sub > h3{font-size:17px; font-weight:800; margin-bottom:4px}
.sub > .cap{color:var(--muted); font-size:14px; max-width:78ch; margin-bottom:12px}
.panel{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:16px 18px}
.empty{color:var(--muted); padding:14px 16px; border:1px dashed var(--border-strong); border-radius:8px; background:var(--surface)}
.err{color:var(--fail); background:var(--fail-bg); border:1.5px solid var(--fail-line); padding:10px 14px; border-radius:8px; font-size:14px}

/* ---------- 1. Verdict ---------- */
.verdict{display:grid; grid-template-columns:auto 1fr; gap:18px 24px; align-items:center; padding:22px 26px; border-radius:12px; border:2px solid var(--xl); background:var(--xbg); -webkit-print-color-adjust:exact; print-color-adjust:exact}
.vicon{width:76px; height:76px}
.vword{font:800 clamp(38px,8vw,60px)/1 var(--sans); letter-spacing:.01em; color:var(--x)}
.headline{font-size:clamp(19px,2.8vw,25px); font-weight:650; line-height:1.28; margin-top:10px; max-width:34em}
.vfix{margin-top:8px; font-size:17px; line-height:1.4; max-width:44em}
.vnext{margin-top:10px; color:var(--muted); font-size:15px}
.vchips{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; align-items:center}
.chip{display:inline-flex; align-items:center; gap:6px; padding:2px 10px 2px 8px; border:1px solid var(--border-strong); border-radius:999px; background:var(--surface); font-size:13px; font-weight:600; color:var(--text)}
.chip .ico{width:14px; height:14px}
.chip.s-fail .ico,.chip.s-warn .ico,.chip.s-pass .ico,.chip.s-skip .ico{color:var(--x)}
.weak{margin-top:12px; font-size:15px}
.partial{margin-top:14px; padding:9px 13px; border:1.5px solid var(--warn-line); background:var(--surface); border-radius:8px; font-size:15px; -webkit-print-color-adjust:exact; print-color-adjust:exact}
.weak a{font-weight:700}

/* ---------- 2. Settings ---------- */
.sgroup{margin-top:22px}
.sgroup > h3{font:800 12px var(--sans); letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-bottom:8px}
.sgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr)); gap:12px}
.scard{position:relative; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:14px 16px 14px; display:flex; flex-direction:column; gap:6px; min-width:0}
.scard.wide,.scard.hero{grid-column:1/-1}
.scard.missing{border:2px dashed var(--border-strong); background:transparent}
.scard.missing .sval{font-size:19px; line-height:1.3; user-select:auto; -webkit-user-select:auto}
.scard.hero{ border:2px solid var(--text); padding:18px 20px}
.slabel{font:700 12px var(--sans); letter-spacing:.08em; text-transform:uppercase; color:var(--muted); padding-right:78px}
.sval{font:700 26px/1.2 var(--mono); overflow-wrap:anywhere; user-select:all; -webkit-user-select:all; cursor:text}
.sval.xl{font-size:34px}
.sval.md{font-size:19px; line-height:1.3}
.hero .sval{font-size:clamp(42px,9vw,68px); line-height:1.05}
.sval .line{display:block}
.sval .line + .line{margin-top:8px}
.sval .lk{display:block; font:700 11px var(--sans); letter-spacing:.09em; text-transform:uppercase; color:var(--muted)}
.sval .lv{display:block; font-size:18px; line-height:1.3; overflow-wrap:anywhere}
.swhy{font-size:14px; color:var(--muted); max-width:70ch}
.shint{font-size:14px; color:var(--text); background:var(--surface-2); border:1px solid var(--border); border-radius:6px; padding:7px 10px; margin-top:4px}
.shint code{font-weight:700}
.scard .cp{position:absolute; top:10px; right:10px}
.obits{display:grid; gap:0; margin-top:4px}
.obit{display:grid; grid-template-columns:1fr auto; gap:2px 12px; padding:9px 0; border-top:1px solid var(--border)}
.obit:first-child{border-top:0}
.obit .on{font-weight:700}
.obit .ov{font:700 19px var(--mono); text-align:right; user-select:all; -webkit-user-select:all}
.obit .od{grid-column:1/-1; font-size:13px; color:var(--muted)}
.copybar{display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px; margin:2px 0 4px}
.copynote{font-size:14px; color:var(--muted)}
.fallback{margin-top:10px}
.fallback textarea{width:100%; min-height:160px; font:13px/1.4 var(--mono); background:var(--surface); color:var(--text); border:1.5px solid var(--border-strong); border-radius:6px; padding:8px}
.prov{margin:10px 0 0; padding:10px 14px; border-radius:8px; border:1.5px solid var(--warn-line); background:var(--warn-bg); color:var(--text); font-size:15px}

/* ---------- 3. Issues ---------- */
.issue{background:var(--surface); border:1px solid var(--border); border-left:7px solid var(--xl); border-radius:9px; padding:14px 18px 16px; margin-bottom:14px; break-inside:avoid}
.issue > header{display:flex; flex-wrap:wrap; align-items:center; gap:6px 12px}
.issue h3{font-size:18px; font-weight:750; line-height:1.3}
.secnote{margin-left:auto; font:600 12px var(--sans); text-transform:uppercase; letter-spacing:.08em; color:var(--faint)}
.vl{display:flex; flex-wrap:wrap; gap:10px 28px; align-items:flex-end; margin:12px 0 8px}
.vl .k{display:block; font:700 11px var(--sans); letter-spacing:.09em; text-transform:uppercase; color:var(--muted)}
.vl .v{font:700 22px/1.2 var(--mono); overflow-wrap:anywhere}
.vl .v.lim{color:var(--muted)}
.margin{display:flex; flex-direction:column; gap:3px; min-width:170px}
.mbar{position:relative; height:12px; width:190px; max-width:100%; background:var(--surface-2); border:1px solid var(--border-strong); border-radius:3px}
.mbar i{position:absolute; left:0; top:0; bottom:0; background:var(--xl); border-radius:2px 0 0 2px; -webkit-print-color-adjust:exact; print-color-adjust:exact}
.mbar b{position:absolute; top:-4px; bottom:-4px; width:2px; margin-left:-1px; background:var(--text)}
.mtxt{font-size:12px; color:var(--muted)}
.mtxt strong{color:var(--x); font-weight:700}
.detail{font-size:15px; color:var(--text); max-width:78ch}
.fix{margin-top:10px; padding:10px 14px; border-radius:7px; background:var(--surface-2); border:1px solid var(--border)}
.fix b{display:block; font:800 11px var(--sans); letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-bottom:2px}
.fix p{font-size:15px; max-width:78ch}
.allgood{display:flex; align-items:center; gap:14px; padding:16px 18px; border:1.5px solid var(--go-line); background:var(--go-bg); border-radius:10px; -webkit-print-color-adjust:exact; print-color-adjust:exact}
.allgood svg{width:34px; height:34px; color:var(--go); flex:none}
.skipnote{margin-top:6px; color:var(--muted); font-size:14px}

/* ---------- 4. All checks ---------- */
.grp{background:var(--surface); border:1px solid var(--border); border-radius:10px; margin-bottom:12px}
.grp > summary{list-style:none; cursor:pointer; display:flex; flex-wrap:wrap; align-items:center; gap:6px 12px; padding:12px 16px}
.grp > summary::-webkit-details-marker{display:none}
.grp > summary::before{content:""; width:0; height:0; border-left:6px solid var(--text); border-top:5px solid transparent; border-bottom:5px solid transparent; transition:transform .12s; margin-right:2px}
.grp[open] > summary::before{transform:rotate(90deg)}
.gname{font-weight:800; font-size:17px}
.gsum{margin-left:auto; color:var(--muted); font-size:13px}
.gnote{padding:0 16px 8px 34px; color:var(--muted); font-size:14px}
.row{display:grid; grid-template-columns:86px 1fr minmax(150px,230px); gap:6px 16px; padding:11px 16px; border-top:1px solid var(--border); align-items:start}
.row .rt b{font-weight:700; display:block; line-height:1.3}
.row .rd{display:block; color:var(--muted); font-size:14px; margin-top:2px}
.row .rv{text-align:right; min-width:0}
.row .rv .v{font:700 15px var(--mono); overflow-wrap:anywhere}
.row .rv .l{display:block; font-size:12.5px; color:var(--muted); overflow-wrap:anywhere}
.row .mbar{height:8px; width:100%; margin-top:6px; margin-left:auto}
.row.s-skip .rt b{color:var(--muted)}

/* ---------- 5. Checklist ---------- */
.ticks{list-style:none; margin:0; padding:0; display:grid; gap:8px}
.tick{display:flex; gap:14px; align-items:flex-start; padding:12px 16px; background:var(--surface); border:1px solid var(--border); border-radius:9px; cursor:pointer; break-inside:avoid}
.tick:hover{border-color:var(--border-strong)}
.tick input{width:26px; height:26px; margin:1px 0 0; flex:none; accent-color:var(--accent); cursor:pointer}
.tick .tx{font-size:16px; line-height:1.4}
.tick input:checked + .tx{color:var(--muted); text-decoration:line-through; text-decoration-thickness:1.5px}
.tprog{margin:0 0 10px; color:var(--muted); font-size:14px}

/* ---------- 6. Evidence ---------- */
.chart{width:100%; min-height:40px}
.chart svg{display:block; width:100%; height:auto; overflow:visible}
svg text{font-family:var(--sans); fill:var(--text); font-size:12px}
svg .mono{font-family:var(--mono)}
svg .tm{fill:var(--muted)}
svg .tb{font-weight:700}
.c-grid{stroke:var(--border); stroke-width:1}
.c-axis{stroke:var(--border-strong); stroke-width:1}
.c-band{fill:var(--band)}
.c-bar{fill:var(--bar)}
.c-cap{stroke:var(--bar); stroke-width:2}
.c-p50{stroke:var(--text); stroke-width:3}
.c-calc{stroke:var(--accent); stroke-width:2; stroke-dasharray:5 3}
.c-calct{fill:var(--accent); font-weight:700}
.c-off{fill:var(--text)}
.c-offt{font-size:10.5px; font-weight:700}
.c-hatch{stroke:var(--bar); stroke-width:1.5}
.c-hatchbar{stroke:var(--bar); stroke-width:1.5; fill:none}
.c-none{stroke:var(--border-strong); stroke-width:1.5; stroke-dasharray:4 4}
.c-lossbar{fill:var(--bar)}
.c-losszero{fill:var(--go-line)}
.c-losshot{fill:var(--fail-solid)}
.c-thr{stroke:var(--fail-line); stroke-width:1.5; stroke-dasharray:5 3}
.c-thrt{fill:var(--fail); font-weight:700}
.halo{paint-order:stroke; stroke:var(--surface); stroke-width:4px; stroke-linejoin:round}
.c-warnline{stroke:var(--warn-line); stroke-width:1; stroke-dasharray:3 4}
.c-warnt{fill:var(--warn)}
.ln{fill:none; stroke-width:2.4; stroke-linejoin:round; stroke-linecap:round}
.l-cpu{stroke:var(--c1)} .l-genc{stroke:var(--c2)} .l-gdec{stroke:var(--c3)} .l-g3d{stroke:var(--c4)} .l-mem{stroke:var(--c5); stroke-width:1.5}
.t-cpu{fill:var(--c1)!important} .t-genc{fill:var(--c2)!important} .t-gdec{fill:var(--c3)!important} .t-g3d{fill:var(--c4)!important} .t-mem{fill:var(--c5)!important}
.lg{display:flex; flex-wrap:wrap; gap:6px 18px; font-size:13px; color:var(--muted); margin-top:8px}
.lg span{display:inline-flex; align-items:center; gap:6px}
.lg i{display:inline-block; width:22px; height:10px; border-radius:2px}
.lg i.sw-bar{background:var(--bar)}
.lg i.sw-band{background:var(--band); border:1px solid var(--border-strong)}
.lg i.sw-p50{width:4px; height:14px; background:var(--text)}
.lg i.sw-hatch{background:repeating-linear-gradient(135deg,var(--bar) 0 2px,transparent 2px 5px); border:1px solid var(--bar)}
.lg i.sw-calc{height:0; border-top:2px dashed var(--accent)}
.lg i.sw-off{width:0; height:0; border-radius:0; background:none; border-left:10px solid var(--text); border-top:6px solid transparent; border-bottom:6px solid transparent}
.lg i.sw-hot{background:var(--fail-solid)}
.udp{margin-bottom:18px}
.udp .uh{display:flex; flex-wrap:wrap; gap:2px 14px; align-items:baseline; margin-bottom:4px}
.udp .uh b{font-size:15px}
.udp .uh span{font-size:13px; color:var(--muted)}
table{border-collapse:collapse; width:100%; font-size:14px}
th{font:700 11px var(--sans); letter-spacing:.08em; text-transform:uppercase; color:var(--muted); text-align:left; padding:6px 10px; border-bottom:2px solid var(--border-strong); white-space:nowrap}
td{padding:7px 10px; border-bottom:1px solid var(--border); vertical-align:top}
td.num,th.num{text-align:right; font-family:var(--mono)}
.tscroll{overflow-x:auto}
dl.kv{display:grid; grid-template-columns:minmax(120px,190px) 1fr; gap:6px 16px; margin:0; font-size:14px}
dl.kv dt{color:var(--muted); font-weight:600}
dl.kv dd{margin:0; overflow-wrap:anywhere}
.two{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr)); gap:14px}
details.fold{background:var(--surface); border:1px solid var(--border); border-radius:9px; margin-top:10px}
details.fold > summary{cursor:pointer; padding:11px 16px; font-weight:700}
details.fold > .fb{padding:2px 16px 14px}
pre.raw{margin:0; max-height:520px; overflow:auto; font:12px/1.45 var(--mono); background:var(--surface-2); border:1px solid var(--border); border-radius:6px; padding:12px; white-space:pre; tab-size:2}
.foot{margin-top:50px; padding-top:14px; border-top:1px solid var(--border); color:var(--muted); font-size:13px}

/* ---------- Local network (inside 6. Evidence) ---------- */
.lan-glance{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr)); gap:12px; margin:2px 0 4px}
.lgc{background:var(--surface); border:1px solid var(--border); border-left:7px solid var(--xl); border-radius:9px; padding:11px 16px 12px; min-width:0; display:flex; flex-direction:column; gap:3px}
.lgc > header{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:4px 10px}
.lgc .k{font:700 11px var(--sans); letter-spacing:.09em; text-transform:uppercase; color:var(--muted)}
.lgc .big{font:800 28px/1.15 var(--mono); overflow-wrap:anywhere}
.lgc .big .nm{font-size:18px}
.lgc .sm{font-size:14px; color:var(--muted)}
.lgc .sm a{font-weight:700}
.lh{margin:26px 0 4px; font-size:16px; font-weight:800}
.lkv{display:flex; flex-wrap:wrap; gap:8px 30px}
.lkv .k{display:block; font:700 11px var(--sans); letter-spacing:.09em; text-transform:uppercase; color:var(--muted)}
.lkv .v{font:700 15px var(--mono); overflow-wrap:anywhere}
.lkv .v small{display:block; font:400 12.5px var(--sans); color:var(--muted)}
.lcount{margin:2px 0 10px; font-size:15px; display:flex; flex-wrap:wrap; align-items:center; gap:4px 10px}
.ptag{display:inline-block; min-width:44px; text-align:center; padding:0 7px; border:1.5px solid currentColor; border-radius:5px; font:800 11.5px/1.6 var(--sans); letter-spacing:.06em}
.ptag.omt{color:var(--c1)}
.ptag.ndi{color:var(--c3)}

.lanp > header{display:flex; flex-wrap:wrap; align-items:center; gap:4px 10px}
.lanp .ph{font:700 16px var(--mono)}
.lanp .pnote{margin:6px 0 0; font-size:14px; max-width:78ch}
.thr{display:grid; grid-template-columns:44px minmax(0,1fr) minmax(150px,240px); gap:2px 14px; align-items:center; margin-top:9px}
.thr .tk{font:700 12px var(--sans); letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.thr .mbar{width:100%; height:14px}
.thr .tv{font:700 14px var(--mono); min-width:0}
.thr .tv span{display:block; font:400 12.5px var(--sans); color:var(--muted)}
table.stack td .cv{min-width:0}
details.fold.lan-fold > summary{font-weight:600}
.thr.wl{grid-template-columns:82px minmax(0,1fr) minmax(150px,240px)}

/* ---------- Observer: next step box, error lines ---------- */
.scard.next{border:2px solid var(--accent); border-left-width:8px; padding:18px 20px; gap:10px}
.nextlead{font-size:18px; font-weight:700; line-height:1.35; max-width:44em; padding-right:78px}
.phold{background:var(--warn-bg); color:var(--warn); border-radius:4px; padding:0 5px; font-style:normal; overflow-wrap:anywhere}
.nextwarn{margin:2px 0 0; padding:10px 14px; border-radius:8px; border:1.5px solid var(--warn-line); background:var(--warn-bg); color:var(--text); font-size:15px; -webkit-print-color-adjust:exact; print-color-adjust:exact}
.elines{margin:8px 0 0; padding:8px 10px; background:var(--surface-2); border:1px solid var(--border); border-radius:6px; font:12.5px/1.5 var(--mono); white-space:pre-wrap; overflow-wrap:anywhere; color:var(--text)}
.notice{margin-top:12px; padding:12px 16px; border:1.5px solid var(--warn-line); border-left-width:7px; background:var(--warn-bg); border-radius:8px; font-size:15px; -webkit-print-color-adjust:exact; print-color-adjust:exact}
.notice p{margin:6px 0 0; max-width:78ch}
.notice > p:first-child{margin-top:0}
.notice .elines{background:var(--surface)}

/* ---------- No data ---------- */
.nodata{margin-top:40px; padding:32px 28px; background:var(--surface); border:2px dashed var(--border-strong); border-radius:14px; max-width:640px}
.nodata h1{font-size:28px; margin-bottom:10px}
.nodata p{margin:8px 0; color:var(--muted)}
.nodata ol{color:var(--muted); padding-left:22px}

/* ---------- Phone ---------- */
@media (max-width:640px){
  .page{padding:10px 14px 64px}
  .verdict{grid-template-columns:1fr; padding:18px 18px; gap:12px}
  .vicon{width:56px; height:56px}
  .sec{margin-top:36px}
  .sec > h2{font-size:20px}
  .row{grid-template-columns:1fr; gap:4px}
  .row .rv{text-align:left}
  .row .mbar{margin-left:0}
  .issue{padding:12px 14px 14px}
  .secnote{margin-left:0}
  .scard .cp{position:static; align-self:flex-start; margin-top:4px}
  .slabel{padding-right:0}
  .sval{font-size:22px}
  .sval.xl{font-size:28px}
  .gsum{margin-left:0; width:100%}
  dl.kv{grid-template-columns:1fr; gap:0}
  dl.kv dt{margin-top:8px}
  .lgc .big{font-size:24px}
  .thr, .thr.wl{grid-template-columns:1fr; gap:3px}
  .thr .tv{margin-bottom:6px}
  .nextlead{padding-right:0}
  table.stack thead{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}

  table.stack tr{padding:9px 0; border-bottom:1px solid var(--border)}
  table.stack td{display:flex; gap:10px; border:0; padding:2px 0}
  table.stack td::before{content:attr(data-label); flex:none; width:78px; font:700 11px/1.9 var(--sans); letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
  table.stack td.e{display:none}
  table.stack td.num{text-align:left}
  table.stack td .cv{overflow-wrap:anywhere}
}

/* ---------- Print (A4) ---------- */
@page{size:A4; margin:11mm}
@media print{
  html{font-size:13px}
  body{background:#fff; color:#000}
  .page{max-width:none; padding:0}
  .noprint,.nav,.btn,.cp,.fallback,.copybar .copynote{display:none!important}
  .sec{margin-top:22px}
  .sec > h2{break-after:avoid}
  #all,#evidence{break-before:page; margin-top:0}
  .row.s-pass .rd{display:none}
  .row{padding:7px 12px}
  .verdict,.scard,.issue,.grp,.tick,.panel,.udp,.obit,.row,.lgc,.lanp{break-inside:avoid}
  details.fold.raw-fold{display:none}
  .grp > summary::before{display:none}
  .scard.hero .sval{font-size:46px}
  .sval{user-select:auto}
  pre.raw{max-height:none}
}

function srtCalcRtt(rows){
  var cp = g(D, 'verdict.calc.srt.rtt_p95_ms');

  var c = checkById('fr_rtt'), m = c && String(c.value || '').replace(/,/g, '').match(/(\d+(?:\.\d+)?)/);
  if (m) return parseFloat(m[1]);

}
function rttRows(){
  return arr(g(D, 'network.targets')).filter(function(t){ return t && t.group === 'france'; }).map(function(t){
    var ic = t.icmp, tc = t.tcp, name = t.name || t.host || 'target';
    if (ic && !ic.blocked && isNum(ic.p50_ms) && isNum(ic.p95_ms)){
      return {name:name, kind:'icmp', min:isNum(ic.min_ms) ? ic.min_ms : ic.p50_ms, p50:ic.p50_ms, p95:ic.p95_ms};
    }
    if (tc && isNum(tc.p50_ms)){
      var s = arr(tc.samples_ms).filter(isNum);
      return {name:name, kind:'tcp', min:s.length ? Math.min.apply(null, s) : tc.p50_ms, p50:tc.p50_ms, p95:isNum(tc.p95_ms) ? tc.p95_ms : tc.p50_ms, blocked:!!(ic && ic.blocked)};

}
/* Axis for the RTT chart. It is capped so one slow TCP connect (for example 1,200 ms over Wi-Fi) cannot squash the real 210-290 ms cluster:

function rttDomain(rows, calc){
  var vals = [];
  rows.forEach(function(r){ if (r.kind !== 'none'){ vals.push(r.min, r.p95); } });
  if (isNum(calc)) vals.push(calc);
  if (!vals.length) return null;
  var cap = Math.ceil(Math.max(400, 1.25 * (isNum(calc) ? calc : 0)) / 100) * 100;
  var lo = Math.max(0, Math.floor((Math.min.apply(null, vals) - 15) / 25) * 25), hi = Math.ceil((Math.max.apply(null, vals) + 15) / 25) * 25;
  if (hi > cap) hi = cap;
  if (hi - lo < 100) lo = Math.max(0, hi - 100);
  if (hi - lo < 100) hi = lo + 100;
  var off = rows.filter(function(r){ return r.kind !== 'none' && r.p95 > hi; });
  return {lo: lo, hi: hi, cap: cap, off: off};
}
function drawRtt(el, rows, calc){
  var W = Math.floor(el.clientWidth); if (W < 220) return;
  var narrow = W < 700, padL = narrow ? 6 : 190, padR = narrow ? 6 : 196, topPad = 30, botPad = 26, rowH = narrow ? 52 : 36;
  var dom = rttDomain(rows, calc);
  if (!dom){ el.innerHTML = '<p class="empty">' + nm('No France round-trip times were measured') + '</p>'; return; }
  var lo = dom.lo, hi = dom.hi;
  var H = topPad + rows.length * rowH + botPad, x0 = padL, x1 = W - padR;
  var X = function(v){ return x0 + (Math.min(v, hi) - lo) / (hi - lo) * (x1 - x0); };
  var step = niceStep(hi - lo, narrow ? 4 : 7), s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Round-trip time to each French network, showing minimum, typical and 95th percentile">';
  s += '<defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" class="c-hatch"/></pattern></defs>';

  var b0 = Math.max(lo, 210), b1 = Math.min(hi, 290);
  if (b1 > b0) s += '<rect class="c-band" x="' + X(b0).toFixed(1) + '" y="' + topPad + '" width="' + (X(b1) - X(b0)).toFixed(1) + '" height="' + (rows.length * rowH) + '"/>';
  for (var v = Math.ceil(lo / step) * step; v <= hi + 0.001; v += step){
    s += '<line class="c-grid" x1="' + X(v).toFixed(1) + '" x2="' + X(v).toFixed(1) + '" y1="' + topPad + '" y2="' + (H - botPad) + '"/>' +
         '<text class="tm mono" x="' + X(v).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle">' + v + '</text>';
  }
  rows.forEach(function(r, i){
    var y = topPad + i * rowH, cy = narrow ? y + 34 : y + rowH / 2;
    var nameY = narrow ? y + 16 : cy + 4;
    s += '<text class="tb halo" x="' + (narrow ? 2 : 0) + '" y="' + nameY + '" style="font-size:13px">' + esc(trunc(r.name, narrow ? 22 : 28)) + '</text>';
    if (r.kind === 'none'){
      s += '<line class="c-none" x1="' + x0 + '" x2="' + x1 + '" y1="' + cy + '" y2="' + cy + '"/>';
      s += '<text class="tm" x="' + W + '" y="' + nameY + '" text-anchor="end">' + (r.blocked ? 'no reply (ignores ping, no TCP answer)' : 'no reply') + '</text>';

    var xa = X(r.min), xb = X(r.p95), xm = X(r.p50), p50On = r.p50 <= hi;
    if (offAll){

    } else if (r.kind === 'tcp'){
      s += '<rect class="c-hatchbar" x="' + xa.toFixed(1) + '" y="' + (cy - 6) + '" width="' + Math.max(2, xb - xa).toFixed(1) + '" height="12" rx="2"/>' +
           '<rect fill="url(#hatch)" x="' + xa.toFixed(1) + '" y="' + (cy - 6) + '" width="' + Math.max(2, xb - xa).toFixed(1) + '" height="12" rx="2"/>';
    } else {
      s += '<rect class="c-bar" x="' + xa.toFixed(1) + '" y="' + (cy - 6) + '" width="' + Math.max(2, xb - xa).toFixed(1) + '" height="12" rx="2"/>';
    }
    if (!offAll){
      s += '<line class="c-cap" x1="' + xa.toFixed(1) + '" x2="' + xa.toFixed(1) + '" y1="' + (cy - 9) + '" y2="' + (cy + 9) + '"/>';
      if (!offBar) s += '<line class="c-cap" x1="' + xb.toFixed(1) + '" x2="' + xb.toFixed(1) + '" y1="' + (cy - 9) + '" y2="' + (cy + 9) + '"/>';
      if (p50On) s += '<line class="c-p50" x1="' + xm.toFixed(1) + '" x2="' + xm.toFixed(1) + '" y1="' + (cy - 10) + '" y2="' + (cy + 10) + '"/>';
    }
    if (offBar){   // clipped at the right edge: arrowhead plus a label; the true numbers stay in the text on the right
      s += '<path class="c-off" d="M' + (x1 + 1) + ' ' + (cy - 7) + 'L' + (x1 + 11) + ' ' + cy + 'L' + (x1 + 1) + ' ' + (cy + 7) + 'Z"/>' +

    var lab = narrow ? 'SRT uses ' + Math.round(calc) + ' ms' : Math.round(calc) + ' ms used for SRT latency', lw = lab.length * 7;

}
function renderRtt(){

/* ---- UDP ---- */
function udpTests(){ return arr(g(D, 'network.udp')).filter(function(u){ return u && typeof u === 'object'; }); }
function drawUdp(el, u, yMax){
  var W = Math.floor(el.clientWidth); if (W < 200) return;
  var iv = arr(u.intervals).filter(function(x){ return x && isNum(x.packets) && x.packets > 0; });
  if (!iv.length){ el.innerHTML = '<p class="mtxt">' + nm('No per-second data for this test') + '</p>'; return; }
  var H = 150, pl = 40, pr = 8, pt = 10, pb = 26, pw = W - pl - pr, ph = H - pt - pb;
  var Y = function(v){ return pt + ph - Math.min(v, yMax) / yMax * ph; };
  var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Packet loss per second for ' + esc(u.host || 'target') + '">';
  [0, BURST_PCT, yMax].filter(function(v, i, a){ return a.indexOf(v) === i; }).forEach(function(v){
    s += '<line class="' + (v === BURST_PCT ? 'c-thr' : 'c-grid') + '" x1="' + pl + '" x2="' + (W - pr) + '" y1="' + Y(v).toFixed(1) + '" y2="' + Y(v).toFixed(1) + '"/>' +
         '<text class="mono ' + (v === BURST_PCT ? 'c-thrt' : 'tm') + '" x="' + (pl - 5) + '" y="' + (Y(v) + 4).toFixed(1) + '" text-anchor="end">' + v + '%</text>';

    if (loss <= 0){ s += '<rect class="c-losszero" x="' + bx.toFixed(1) + '" y="' + (Y(0) - 2.5).toFixed(1) + '" width="' + bwi.toFixed(1) + '" height="2.5"/>'; }

/* ---- Local network (LAN step) ---- */
/* results.json does not carry config.thresholds, so the pass/warn limits below are the defaults from config.json (lan_partner_ratio, lan_partner_udp_loss_pct).

var LAN_PARTNER_RATIO = 1.5, LAN_PARTNER_WARN_RATIO = 1.0, LAN_LOSS_PASS = 0.1, LAN_LOSS_WARN = 1;
function isObj(v){ return v != null && typeof v === 'object' && !Array.isArray(v); }
function ipKey(ip){ var p = String(ip == null ? '' : ip).split('.'); return p.length === 4 ? ((+p[0]) * 16777216 + (+p[1]) * 65536 + (+p[2]) * 256 + (+p[3])) : 1e13; }
function fmtMbps(v){ return isNum(v) ? (v >= 1000 ? thousands(v) : String(r1(v))) : null; }
function lanProto(){ var p = g(D, 'profile.inputs.protocol') || g(D, 'lan.test.protocol'); return p ? (/^OMT/i.test(String(p)) ? 'OMT' : 'NDI') : null; }
function lanExpected(){ var n = g(D, 'profile.inputs.count'); return isNum(n) ? n : null; }
function lanPerFeed(){
  var v = g(D, 'lan.test.per_feed_mbps'); if (isNum(v)) return v;
  var p = g(D, 'profile.inputs.protocol'), m = g(D, 'profile.inputs.mbps_per_feed');
  if (p && isObj(m)){ var x = isNum(m[p]) ? m[p] : (/^NDI/i.test(String(p)) ? m.NDI : null); if (isNum(x)) return x; }

}
function lanLimits(per){

  var m1 = lim.match(/(?:>=|≥)\s*(\d+(?:\.\d+)?)\s*Mbps/), m2 = lim.match(/<\s*(\d+(?:\.\d+)?)\s*%/);

}
function lanSources(){ return arr(g(D, 'lan.sources')).filter(isObj); }
function lanCounted(P){ return lanSources().filter(function(s){ return (!P || s.protocol === P) && s.local !== true; }); }
function lanPartners(){ return arr(g(D, 'lan.partners')).filter(isObj); }

/* The "Both at once" card: shown next to the per-source cards, only when lan.combined exists. */

function lineChart(el, samples, series, o){
  var W = Math.floor(el.clientWidth); if (W < 240) return;
  var narrow = W < 560, pl = 38, pr = narrow ? 78 : 96, pt = 12, pb = 26, H = o.h;
  var t0 = samples[0].t, t1 = samples[samples.length - 1].t; if (t1 <= t0) t1 = t0 + 1;
  var X = function(t){ return pl + (t - t0) / (t1 - t0) * (W - pl - pr); };
  var Y = function(v){ return pt + (H - pt - pb) * (1 - (v - o.lo) / (o.hi - o.lo)); };
  var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(o.aria) + '">';
  var step = niceStep(o.hi - o.lo, 4);
  for (var v = Math.ceil(o.lo / step) * step; v <= o.hi + 0.001; v += step){
    s += '<line class="c-grid" x1="' + pl + '" x2="' + (W - pr) + '" y1="' + Y(v).toFixed(1) + '" y2="' + Y(v).toFixed(1) + '"/><text class="tm mono" x="' + (pl - 5) + '" y="' + (Y(v) + 4).toFixed(1) + '" text-anchor="end">' + Math.round(v) + '</text>';
  }
  (o.refs || []).forEach(function(r){
    s += '<line class="' + r.cls + '" x1="' + pl + '" x2="' + (W - pr) + '" y1="' + Y(r.v).toFixed(1) + '" y2="' + Y(r.v).toFixed(1) + '"/>' +
         '<text class="halo ' + r.tcls + '" x="' + (pl + 4) + '" y="' + (Y(r.v) - 4).toFixed(1) + '" style="font-size:11px">' + esc(r.label) + '</text>';
  });

    s += '<text class="tm mono" x="' + X(tt).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle" style="font-size:11px">' + Math.round(tt) + '</text>';

  series.forEach(function(se){
    var pts = samples.filter(function(p){ return isNum(p[se.k]); });
    if (pts.length < 2) return;
    var d = pts.map(function(p, i){ return (i ? 'L' : 'M') + X(p.t).toFixed(1) + ' ' + Y(Math.max(o.lo, Math.min(o.hi, p[se.k]))).toFixed(1); }).join(' ');

    var last = pts[pts.length - 1];

  ends.forEach(function(e){ s += '<text class="halo tb ' + e.tcls + '" x="' + (W - pr + 6) + '" y="' + (e.y + 4).toFixed(1) + '" style="font-size:' + (narrow ? 11 : 12) + 'px">' + esc(e.label) + '</text>'; });
  s += '</svg>';
  el.innerHTML = s;
}

          '<td class="num">' + (isNum(x.speed_min) ? x.speed_min.toFixed(2) + '×' : '–') + '</td><td class="num">' + (isNum(x.speed_p50) ? x.speed_p50.toFixed(2) + '×' : '–') + '</td><td class="num">' + (isNum(x.fps_p50) ? r1(x.fps_p50) : '–') + '</td>' +
          '<td>' + badge(ok ? 'PASS' : bad ? 'FAIL' : 'SKIP') + (x.error ? '<div class="mtxt">' + esc(x.error) + '</div>' : '') + '</td></tr>';
      }).join('') + '</tbody></table></div><p class="mtxt" style="margin-top:6px">Speed 1.00× means the stream kept up with real time. Anything under 0.97× means the PC fell behind.' + (fell ? ' These streams were encoded on the CPU, so they say nothing about the GPU encoder.' : '') + '</p>';
  }
  var enc = g(D, 'loadtest.encoders');
  if (enc){
    var tested = arr(enc.tested).filter(Boolean).map(function(t){ return esc(t.name) + (t.ok ? ' (works)' : ' (not available)'); }).join(' · ');
    var why = failedEncoders().map(function(t){ var l = encLines(t); return l.length ? '<strong>' + esc(t.name || '?') + '</strong>' + (isNum(t.driver_required) ? ' <span class="mtxt">(needs NVIDIA driver ' + esc(String(r2(t.driver_required))) + ' or newer)</span>' : '') + '<div class="elines">' + esc(l.join('\n')) + '</div>' : ''; }).filter(Boolean).join('');
    h += '<dl class="kv" style="margin-top:12px"><dt>Encoder chosen</dt><dd>' + (enc.chosen ? '<strong>' + esc(enc.chosen) + '</strong>' + (fell ? ' <span class="mtxt">(CPU: not what vMix/OBS would use)</span>' : '') : nm('none worked')) + '</dd>' +
      (tested ? '<dt>Encoders tried</dt><dd>' + tested + '</dd>' : '') +
      (why ? '<dt>Why some did not work</dt><dd>' + why + '</dd>' : '') +
      (g(D, 'loadtest.ffmpeg.version') ? '<dt>Test tool</dt><dd>ffmpeg ' + esc(g(D, 'loadtest.ffmpeg.version')) + '</dd>' : '') + '</dl>';
  }
  if (g(D, 'loadtest.note')) h += '<p class="mtxt" style="margin-top:8px">' + esc(g(D, 'loadtest.note')) + '</p>';
  arr(g(D, 'loadtest.errors')).forEach(function(e){ h += '<p class="err" style="margin-top:8px">' + esc(e) + '</p>'; });
  return h + '</div>';
}

/* ---- Observer: sender test (one 1080p60 feed out) ---- */
function senderSamples(){ return arr(g(D, 'sender.system.samples')).filter(function(s){ return s && isNum(s.t); }); }
function renderSender(){
  var S = g(D, 'sender');
  var h = '<div class="sub" id="ev-sender"><h3>Sender test: one 1080p60 feed, in real time</h3>' +
    '<p class="cap">This PC encoded one 1080p60 video feed' + (isNum(g(S, 'seconds')) ? ' for ' + esc(g(S, 'seconds')) + ' seconds' : '') + ' at real-time speed while we watched CPU use. That is the job an NDI or OMT sender does for the show PC. Run it with the game or observer client open, as on show day, so the numbers include its load.</p>';
  if (!isObj(S)) return h + '<p class="empty">' + nm('The sender test did not run') + '</p></div>';
  if (g(S, 'ffmpeg.found') === false) return h + '<p class="empty">' + nm('Not tested') + '. ffmpeg was not found in the bin folder, so the sender test could not run.</p></div>';
  if (S.note) h += '<p class="shint"><strong>About the codec.</strong> ' + esc(S.note) + '</p>';
  var rt = checkById('sender_realtime'), k = rt ? sk(rt.status) : 'info', lim = limitNum('sender_realtime', 0.97);
  var smin = g(S, 'stream.speed_min'), sp50 = g(S, 'stream.speed_p50'), mx = g(S, 'max_speed');
  var vals = [lim * 1.25, 1.25];
  [smin, sp50].forEach(function(v){ if (isNum(v)) vals.push(v * 1.15); }); if (isNum(mx)) vals.push(mx * 1.1);
  var scale = Math.ceil(Math.max.apply(null, vals) * 4) / 4;
  function row(label, v, cls, line1, line2){
    var r = '<div class="thr wl ' + cls + '"><span class="tk">' + esc(label) + '</span>';
    if (isNum(v)) r += thrBar(v, scale, lim, label + ' ' + r2(v) + ' times real time, limit ' + lim) + '<div class="tv">' + esc(r2(v).toFixed(2)) + '× ' + esc(line1) + '<span>' + esc(line2) + '</span></div>';
    else r += '<span></span><div class="tv">' + nm('not measured') + '</div>';
    return r + '</div>';
  }
  h += '<div class="lanp s-' + k + '"><header><span class="ph">Real-time speed</span>' + (rt ? badge(rt.status) : '') + '</header>' +
    (rt && rt.detail ? '<p class="pnote">' + esc(pretty(rt.detail)) + '</p>' : '') +
    row('Slowest', smin, 's-' + k, 'worst second', 'must stay at ' + lim.toFixed(2) + '× or more to count as real time') +
    row('Typical', sp50, 's-' + k, 'median second', '1.00× is exactly real time') +
    row('Unpaced', mx, 's-info', 'flat out', 'the same encode run as fast as it can: the headroom this PC has') +
    '<p class="mtxt" style="margin-top:8px">Speed is how many seconds of video are encoded per second of clock. The black tick is the real-time limit (' + lim.toFixed(2) + '×). Slowest and typical are paced to real time while the test runs; unpaced is a separate 10-second run with no pacing.</p>';
  if (g(S, 'stream.error')) h += '<p class="err" style="margin-top:8px">' + esc(g(S, 'stream.error')) + '</p>';
  h += '</div>';
  // CPU and clock
  var samples = senderSamples();
  h += '<h4 class="lh">CPU while it ran</h4>';
  if (samples.length < 2) h += '<p class="empty">' + nm('No CPU samples were recorded') + '</p>';
  else h += '<div class="panel">' + usageCharts({id:'sender', pid:'senderperf', samples:samples, noun:'the sender test', warn:limitNum('sender_cpu', 70), fail:90, start:g(S, 'system.perf_start')}) + '</div>';
  var sy = g(S, 'system');
  if (isObj(sy)){
    var st = [['CPU use, typical / slow end / peak', [sy.cpu_p50, sy.cpu_p95, sy.cpu_max].map(function(v){ return isNum(v) ? Math.round(v) + '%' : '?'; }).join(' / ')],
      ['GPU 3D (the game), slow end', isNum(sy.gpu_3d_p95) ? Math.round(sy.gpu_3d_p95) + '%' : null],
      ['Memory in use, peak', isNum(sy.mem_used_pct_max) ? Math.round(sy.mem_used_pct_max) + '%' : null],
      ['CPU clock, start / lowest', isNum(sy.perf_start) && isNum(sy.perf_min) ? Math.round(sy.perf_start) + '% / ' + Math.round(sy.perf_min) + '%' : null]];
    h += '<dl class="kv" style="margin-top:12px">' + st.map(function(x){ return '<dt>' + esc(x[0]) + '</dt><dd>' + (x[1] ? esc(x[1]) : nm()) + '</dd>'; }).join('') + '</dl>';
  }
  var fmt = [];
  if (isNum(S.width) && isNum(S.height)) fmt.push(S.width + '×' + S.height + (isNum(S.fps) ? ' at ' + S.fps + ' fps' : ''));
  if (S.codec) fmt.push(String(S.codec) + (S.pix_fmt ? ' (' + S.pix_fmt + ')' : ''));
  if (fmt.length || g(S, 'ffmpeg.version')){
    h += '<dl class="kv" style="margin-top:12px">' + (fmt.length ? '<dt>Test feed</dt><dd>' + esc(fmt.join(', ')) + '</dd>' : '') + (g(S, 'ffmpeg.version') ? '<dt>Test tool</dt><dd>ffmpeg ' + esc(g(S, 'ffmpeg.version')) + '</dd>' : '') + '</dl>';
  }
  arr(g(S, 'errors')).filter(function(e){ return e != null && e !== ''; }).forEach(function(e){ h += '<p class="err" style="margin-top:8px">' + esc(e) + '</p>'; });
  return h + '</div>';
}

/* ---- details: PC, network ---- */
function kvRow(k, v){ return '<dt>' + esc(k) + '</dt><dd>' + (v == null || v === '' ? nm() : v) + '</dd>'; }
function renderDetails(){
  var hw = g(D, 'hardware'), nw = g(D, 'network'), obs = isObs();
  var h = '<div class="sub" id="ev-pc"><h3>' + (obs ? 'This PC and its network adapters' : 'This PC and its network') + '</h3><p class="cap">Facts the checks above were based on.</p><div class="two">';
  // PC
  h += '<div class="panel"><div class="slabel" style="padding:0;margin-bottom:8px">This PC</div>';
  if (!hw) h += nm('Hardware was not inspected');
  else {
    var gp = arr(hw.gpus).filter(Boolean).map(function(x){ return esc(x.name) + (x.integrated ? ' (built into the CPU)' : '') + (isNum(x.vram_gb) ? ', ' + x.vram_gb + ' GB' : '') + (x.driver_version ? ', driver ' + esc(x.driver_version) : '') + (x.driver_date ? ' of ' + esc(x.driver_date) : ''); }).join('<br>');
    var sw = g(hw, 'software') || {};
    var swl = [['vMix', sw.vmix], ['OBS', sw.obs], ['NDI runtime', sw.ndi_runtime], ['NDI tools', sw.ndi_tools], ['DistroAV (NDI for OBS)', sw.distroav], ['OMT', sw.omt]].map(function(x){ return esc(x[0]) + ': ' + (x[1] ? esc(x[1]) : '<span class="nm">not found</span>'); }).join('<br>');
    var pw = hw.power || {};
    var planName = {balanced:'Balanced', high_performance:'High performance', ultimate:'Ultimate performance', power_saver:'Power saver', custom:'Custom'}[pw.plan] || pw.plan;
    var win = hw.windows || {};
    h += '<dl class="kv">' +
      kvRow('Computer', hw.computer ? esc([hw.computer.manufacturer, hw.computer.model].filter(Boolean).join(' ')) + (hw.computer.is_laptop ? ' (laptop)' : '') : null) +
      kvRow('Windows', hw.os ? esc((hw.os.caption || '') + ' ' + (hw.os.version || '')) : null) +
      kvRow('CPU', hw.cpu ? esc(hw.cpu.name) + '<br>' + esc(hw.cpu.cores) + ' cores, ' + esc(hw.cpu.threads) + ' threads' : null) +
      kvRow('Memory', isNum(hw.ram_gb) ? hw.ram_gb + ' GB' : null) +
      kvRow('Graphics', gp) +
      kvRow('Power', hw.power ? esc(planName || 'unknown') + (pw.on_battery === true ? ', ON BATTERY' + (isNum(pw.battery_pct) ? ' (' + pw.battery_pct + '%)' : '') : pw.on_battery === false ? ', mains power' : '') : null) +
      kvRow('Disk', hw.disk ? esc(hw.disk.system_drive || '') + ' ' + (isNum(hw.disk.free_gb) ? r1(hw.disk.free_gb) + ' GB free' : 'free space unknown') + (isNum(hw.disk.total_gb) ? ' of ' + r1(hw.disk.total_gb) + ' GB' : '') : null) +
      kvRow('Software', swl) +
      kvRow('Windows options', 'Hardware GPU scheduling: ' + esc(win.hags || 'unknown') + '<br>Game Mode: ' + esc(win.game_mode || 'unknown') + '<br>Restart pending: ' + (win.pending_reboot === true ? 'yes' : win.pending_reboot === false ? 'no' : 'unknown')) +
      kvRow('Running now', arr(g(hw, 'processes.running')).length ? esc(arr(hw.processes.running).join(', ')) : 'nothing on the watch list') + '</dl>';
  }
  h += '</div>';
  // network (an observer PC has no internet or France measurements)
  if (!obs) h += '<div class="panel"><div class="slabel" style="padding:0;margin-bottom:8px">Internet connection</div>';
  if (obs){}
  else if (!nw) h += nm('The network was not measured');
  else {
    var pub = nw.public, up = nw.upload;
    h += '<dl class="kv">' +
      kvRow('Public address', pub && pub.ip ? esc(pub.ip) + (pub.org ? '<br>' + esc(pub.org) : '') + (pub.city || pub.country ? '<br>' + esc([pub.city, pub.country].filter(Boolean).join(', ')) : '') : null) +
      kvRow('Upload speed', up && isNum(up.mbps) ? '<strong>' + Math.round(up.mbps) + ' Mbps</strong> (' + esc(up.streams) + ' parallel uploads to a nearby Cloudflare server)' + (up.error ? '<br>' + esc(up.error) : '') : (up && up.error ? esc(up.error) : null)) + '</dl>';
  }
  h += obs ? '</div>' : '</div></div>';
  // NICs
  var nics = arr(g(hw, 'nics')).filter(Boolean);
  if (nics.length){
    var kindName = {wired:'Wired', wifi:'Wi-Fi', virtual:'Virtual', other:'Other'};
    h += '<h4 style="margin:18px 0 6px">Network adapters</h4><p class="mtxt" style="margin-bottom:6px">Virtual adapters are software adapters (Hyper-V, VPN, WSL). They can steal NDI/OMT traffic if left switched on.</p><div class="tscroll"><table><thead><tr><th>Adapter</th><th>Type</th><th>State</th><th class="num">Link Mbps</th><th>Carries internet</th><th>Windows network profile</th><th>Energy-saving Ethernet</th></tr></thead><tbody>' +
      nics.map(function(n){
        return '<tr><td><strong>' + esc(n.name || '?') + '</strong>' + (n.description ? '<div class="mtxt">' + esc(n.description) + '</div>' : '') + (arr(n.ipv4).length ? '<div class="mtxt mono">' + esc(n.ipv4.join(', ')) + '</div>' : '') + '</td><td>' + esc(kindName[n.kind] || n.kind || '?') + '</td><td>' + esc(n.status || '?') + '</td><td class="num">' + (isNum(n.link_mbps) ? esc(thousands(n.link_mbps)) : '–') + '</td><td>' + (n.default_route ? 'yes' : '') + '</td><td>' + esc(n.network_category || '–') + '</td><td>' + esc(n.eee || '–') + '</td></tr>';
      }).join('') + '</tbody></table></div>';
  }
  // traces
  var traces = arr(g(nw, 'traces')).filter(function(t){ return t && arr(t.hops).length; }).map(function(t){ return {host:t.host, hops:t.hops.filter(function(p){ return p && typeof p === 'object'; })}; });
  if (traces.length){
    h += '<details class="fold"><summary>Route to France (traceroute)</summary><div class="fb">' + traces.map(function(t){
      return '<p class="mtxt" style="margin:10px 0 4px"><strong>' + esc(t.host) + '</strong>. Each line is one router on the way. A line with no address is a router that does not answer; that is normal.</p><div class="tscroll"><table><thead><tr><th class="num">Hop</th><th>Address</th><th class="num">Replies (ms)</th></tr></thead><tbody>' +
        t.hops.map(function(p){ return '<tr><td class="num">' + esc(p.hop) + '</td><td class="mono">' + (p.ip ? esc(p.ip) : '<span class="nm">no answer</span>') + '</td><td class="num">' + arr(p.rtt_ms).map(function(v){ return isNum(v) ? Math.round(v) : '*'; }).join(' / ') + '</td></tr>'; }).join('') + '</tbody></table></div>';
    }).join('') + '</div></details>';
  }
  // how the run went
  var steps = arr(g(D, 'meta.steps')).filter(function(s){ return s && typeof s === 'object'; });
  if (steps.length){
    h += '<details class="fold"><summary>How this run went (' + steps.length + ' steps)</summary><div class="fb"><div class="tscroll"><table><thead><tr><th>Step</th><th>Result</th><th class="num">Seconds</th><th>Note</th></tr></thead><tbody>' +
      steps.map(function(s){
        var st = String(s.status || '?'), k = st === 'ok' ? 'PASS' : st === 'skipped' ? 'SKIP' : 'FAIL';
        return '<tr><td><strong>' + esc(s.title || s.key || '?') + '</strong></td><td><span class="badge s-' + sk(k) + '">' + icon(sk(k)) + '<span>' + esc(st === 'ok' ? 'OK' : st.toUpperCase()) + '</span></span></td><td class="num">' + (isNum(s.seconds) ? r1(s.seconds) : '–') + '</td><td>' +
          (s.message ? esc(s.message) : '') + (isNum(s.collector_errors) && s.collector_errors > 0 ? ' ' + esc(plural(s.collector_errors, 'collector problem')) : '') + '</td></tr>';
      }).join('') + '</tbody></table></div></div></details>';
  }
  // collection errors
  var errs = [].concat(arr(g(hw, 'errors')), arr(g(nw, 'errors')), arr(g(D, 'lan.errors')), arr(g(D, 'loadtest.errors')), arr(g(D, 'sender.errors')), arr(g(D, 'verdict.errors')), arr(g(D, 'meta.lib_errors'))).filter(function(e){ return e != null && e !== ''; });
  if (errs.length) h +='<details class="fold"><summary>Problems while collecting data (' + errs.length + ')</summary><div class="fb"><ul>' + errs.map(function(e){ return '<li class="mtxt" style="color:var(--text)">' + esc(e) + '</li>'; }).join('') + '</ul></div></details>';
  return h + '</div>';
}

function renderRaw(){
  return '<div class="sub" id="ev-raw"><details class="fold raw-fold" id="rawfold"><summary>Raw results (JSON)</summary><div class="fb"><div class="copybar"><button type="button" class="btn small" data-copyjson>Copy JSON</button><span class="copynote">Send this to whoever maintains the kit if something looks wrong.</span></div><pre class="raw" id="rawpre" tabindex="0"></pre></div></details></div>';
}
function renderEvidence(){
  var h = '<section id="evidence" class="sec" aria-labelledby="h-ev"><h2 id="h-ev"><span class="n">6</span>Evidence</h2><p class="lede">The measurements behind the verdict. You do not need this to run the show, but it is what to send to someone if you need a second opinion.</p>';
  if (isObs()) h += safe('sender test', renderSender) + safe('PC details', renderDetails) + renderRaw();
  else h += safe('France round-trip', renderRtt) + safe('UDP loss', renderUdp) + safe('local network', renderLan) + safe('load test', renderLoad) + safe('PC and network details', renderDetails) + renderRaw();
  return h + '</section>';
}
function renderFooter(){
  var v = g(D, 'meta.tool_version');
  return '<p class="foot">Made by ShowReady' + (v ? ' ' + esc(v) : '') + (D.schema ? ' · data format ' + esc(D.schema) : '') + '. This is a snapshot of one moment on one PC: run it again at the same time of day as the show, and again after you change anything.</p>';
}

/* ================= no data ================= */
function renderNoData(){
  return '<div class="topbar"><div class="brand">ShowReady<span>pre-show check</span></div></div>' +
    '<div class="nodata"><h1>No results to show yet</h1><p>This page is the ShowReady report, but it has not been given any results. Nothing is wrong with it.</p>' +
    '<ol><li>Double-click <code>Run-ShowReady.cmd</code> on the show PC.</li><li>Wait for it to finish (it takes a few minutes).</li><li>It opens the finished report automatically.</li></ol>' +
    '<p>Already have a <code>results.json</code>? Open it here:</p><p><label class="btn" style="display:inline-block">Choose results.json<input type="file" accept=".json,application/json" id="filepick" style="position:absolute;left:-9999px"></label></p><div id="loaderr"></div></div>';
}

/* ================= main render ================= */
function layoutCharts(){
  charts.forEach(function(c){
    if (!c.el) c.el = document.querySelector('[data-chart="' + c.sel + '"]');
    if (!c.el) return;
    try{ c.draw(c.el); }catch(e){ c.el.innerHTML = '<div class="err">Chart could not be drawn (' + esc(e.message) + ').</div>'; }
  });
}
function watchCharts(){
  observers.forEach(function(o){ try{ o.disconnect(); }catch(e){} }); observers = [];
  if (typeof ResizeObserver === 'function'){
    var pending = false;
    var ro = new ResizeObserver(function(){ if (pending) return; pending = true; requestAnimationFrame(function(){ pending = false; layoutCharts(); }); });
    charts.forEach(function(c){ if (c.el) ro.observe(c.el); });
    observers.push(ro);
  }
}
function renderApp(data){
  D = data; charts = []; rawDone = false;
  var root = document.getElementById('app');
  if (!D || typeof D !== 'object'){ root.innerHTML = renderNoData(); wireNoData(); return; }
  var h = safe('header', renderTop);
  if (D.schema && D.schema !== 'showready/1') h += '<p class="err">This report was made by a different version of ShowReady (data format ' + esc(D.schema) + '). Some parts may be missing.</p>';
  h += safe('verdict', renderVerdict) + (isObs() ? safe('next step', renderNext) : '') + safe('settings', renderSettings) + safe('issues', renderIssues) + safe('all checks', renderAll) + safe('checklist', renderManual) + safe('evidence', renderEvidence) + safe('footer', renderFooter);
  root.innerHTML = h;
  layoutCharts(); watchCharts();
  try{
    if (isObs()) document.title = 'ShowReady Observer: ' + (g(D, 'verdict.overall') || 'report') + (g(D, 'meta.computer') || g(D, 'hardware.computer.name') ? ' · ' + (g(D, 'meta.computer') || g(D, 'hardware.computer.name')) : '');
    else document.title = 'ShowReady: ' + (g(D, 'verdict.overall') || 'report') + (g(D, 'profile.name') ? ' · ' + g(D, 'profile.name') : '');
  }catch(e){}
}
function wireNoData(){
  var f = document.getElementById('filepick'); if (!f) return;
  f.addEventListener('change', function(){
    var file = f.files && f.files[0]; if (!file) return;
    var fr = new FileReader();
    fr.onload = function(){ try{ renderApp(JSON.parse(String(fr.result))); }catch(e){ document.getElementById('loaderr').innerHTML = '<p class="err">That file is not valid results JSON (' + esc(e.message) + ').</p>'; } };
    fr.readAsText(file);
  });
}

/* ================= events ================= */
var rawDone = false;
function prettyJson(o){
  var s = JSON.stringify(o, null, 2);
  return s.replace(/\[\s+([^\[\]{}]*?)\s+\]/g, function(m, inner){ return '[' + inner.replace(/\s*\n\s*/g, ' ') + ']'; });
}
document.addEventListener('click', function(e){
  var t = e.target; if (!t || !t.closest) return;
  var b;
  if ((b = t.closest('[data-copyall]'))){ copyText(settingsText(), b, document.getElementById('copyfallback')); return; }
  if ((b = t.closest('[data-copy]'))){ copyText(b.getAttribute('data-copy'), b, null); return; }
  if ((b = t.closest('[data-copyjson]'))){ copyText(JSON.stringify(D, null, 2), b, null); return; }
  if (t.closest('[data-print]')){ window.print(); return; }
});
document.addEventListener('change', function(e){
  var t = e.target; if (!t || !t.getAttribute) return;
  var id = t.getAttribute('data-tick'); if (id == null) return;
  var ticks = loadTicks(); if (t.checked) ticks[id] = true; else delete ticks[id];
  saveTicks(ticks);
  var items = document.querySelectorAll('[data-tick]'), n = 0; for (var i = 0; i < items.length; i++) if (items[i].checked) n++;
  var p = document.getElementById('tprog'); if (p) p.textContent = n + ' of ' + items.length + ' done';
});
document.addEventListener('toggle', function(e){
  var t = e.target;
  if (t && t.id === 'rawfold' && t.open && !rawDone){
    rawDone = true;
    var pre = document.getElementById('rawpre'); if (pre) pre.textContent = prettyJson(D);
  }
}, true);
var resizeTimer = null;
window.addEventListener('resize', function(){ clearTimeout(resizeTimer); resizeTimer = setTimeout(layoutCharts, 80); });
/* print: open the section groups and redraw charts at the page width */
window.addEventListener('beforeprint', function(){ var d = document.querySelectorAll('details.grp, details.open-print'); for (var i = 0; i < d.length; i++) d[i].setAttribute('open', ''); });

window.__render = renderApp;
renderApp(DATA);
})();
</script>
